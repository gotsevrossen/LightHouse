[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lighthouse-security-copilot"
version = "0.1.0"
description = "Local AI security triage service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "bcrypt>=4.2,<5",
]

[project.optional-dependencies]
# The native window for the Linux desktop build. Not installed on the appliance,
# which has no display and serves the same dashboard over the LAN instead.
desktop = ["pywebview>=5.1,<6"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "pyinstaller>=6.10,<7"]

[project.scripts]
lighthouse-desktop = "triage.desktop:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["triage*"]
